name: iOS Build
on: [push, workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS
        run: |
          # platform=ios-arm64 を指定してビルド
          make -f Makefile.libretro platform=ios-arm64
      - name: Upload Core
        uses: actions/upload-artifact@v4
        with:
          name: mupen64plus-next-ios
          path: "*.dylib"
